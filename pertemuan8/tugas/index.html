<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursus</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="form-card">
        <header class="form-header">
          <span class="label-top"> KURSUS MOBILE LEGEND </span>
          <h1>Form  Kursus Mobile Legend</h1>
          <p class="required-info">* Wajib diisi</p>
        </header>
        <!--
enctype multipart/form-data
dibutuhkan untuk pengiriman file.
-->
        <form
          action="/proses-lamaran"
          method="post"
          enctype="multipart/form-data"
        >
          <!-- Nama -->
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input
              type="text"
              id="nama"
              name="nama"
              minlength="3"
              maxlength="60"
              placeholder="Contoh: Jammer Deepseek"
              required
            />
          </div>
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jammer@gmail.com"
              required
            />
            <small> Gunakan alamat email yang masih aktif. </small>
          </div>
          <!-- Nomor HP -->
          <div class="form-group">
            <label for="telepon">Nomor Telepon</label>
            <input
              type="text"
              id="telepon"
              name="telepon"
              pattern="[0-9]{10,13}"
              minlength="10"
              maxlength="13"
              placeholder="Contoh: 081234567890"
              required
            />
            <small> Masukkan 10-13 digit angka. </small>
          </div>
          <!-- Posisi -->
          <div class="form-group">
            <label for="jenis">Jenis Kelamin</label>
            <select id="jenis" name="jenis" required>
              <option value="">-- Pilih Jenis Kelamin --</option>
              <option value="cowo">Laki-Laki</option>
              <option value="cewe">Perempuan</option>
              </select>
          </div>
          <!-- Radio -->
          <fieldset>
            <legend>Jenis Device</legend>
            <div class="option">
              <input
                type="radio"
                id="andro"
                name="andro"
                value="andro"
                required
              />
              <label for="onsite"> Android </label>
            </div>
            <div class="option">
              <input
                type="radio"
                id="ios"
                name="ios"
                value="ios"
              />
              <label for="ios"> IOS </label>
            </div>
            
            
          </fieldset>
          <!-- Kemampuan -->
          <fieldset>
            <legend>Pilih Role</legend>
            <p class="instruction">Bisa lebih dari 1.</p>
            <div class="option">
              <input type="checkbox" id="jung" name="role[]" value="jung" />
              <label for="jung"> Jungler </label>
            </div>
            <div class="option">
              <input type="checkbox" id="gold" name="role[]" value="gold" />
              <label for="gold"> Goldaner </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="exp"
                name="role[]"
                value="exp"
              />
              <label for="exp"> Explaner </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="roam"
                name="role[]"
                value="roam"
              />
              <label for="roam"> Roamer </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="mid"
                name="role[]"
                value="mid"
              />
              <label for="mid"> Midlaner </label>
            </div>
          </fieldset>
          <!-- Textarea -->
          <div class="form-group">
            <label for="alasan"> Alasan Mengikuti Kursus Ini * </label>
            <textarea
              id="alasan"
              name="alasan"
              rows="6"
              minlength="10"
              maxlength="500"
              placeholder="Jelaskan alasan dan tujuan Anda mengikuti kursus ini..."
              required
            ></textarea>
            <small> Tuliskan antara 10-500 karakter. </small>
          </div>
          <!-- Upload Portofolio -->
          <div class="form-group">
            <label for="bukti"> Bukti Pembayaran </label>
            <input
              type="file"
              id="bukti"
              name="bukti"
              accept="pdf"
            />
            <small> Dapat berupa PDF (Max 2MB). </small>
          </div>
          <!-- Persetujuan -->
          <div class="agreement">
            <input
              type="checkbox"
              id="persetujuan"
              name="persetujuan"
              value="setuju"
              required
            />
            <label for="persetujuan">
              Saya menyetujui penggunaan data ini untuk proses kursus mobile legend. *
            </label>
          </div>
          <!-- Tombol -->
          <div class="button-group">
            <button type="submit" class="btn btn-primary">Kirim Lamaran</button>
            <button type="reset" class="btn btn-secondary">
              Bersihkan Form
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
