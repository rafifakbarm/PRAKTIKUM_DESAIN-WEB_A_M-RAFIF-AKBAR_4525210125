<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursus</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="form-card">
        <header class="form-header">
          <span class="label-top"> KURSUS MOBILE LEGEND </span>
          <h1>Form Lamaran Kursus Mobile Legend</h1>
          <p class="required-info">* Wajib diisi</p>
        </header>
        <!--
enctype multipart/form-data
dibutuhkan untuk pengiriman file.
-->
        <form
          action="/proses-lamaran"
          method="post"
          enctype="multipart/form-data"
        >
          <!-- Nama -->
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input
              type="text"
              id="nama"
              name="nama"
              minlength="3"
              maxlength="60"
              placeholder="Contoh: Jammer Deepseek"
              required
            />
          </div>
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jammer@gmail.com"
              required
            />
            <small> Gunakan alamat email yang masih aktif. </small>
          </div>
          <!-- Nomor HP -->
          <div class="form-group">
            <label for="telepon">Nomor Telepon</label>
            <input
              type="text"
              id="telepon"
              name="telepon"
              pattern="[0-9]{10,13}"
              minlength="10"
              maxlength="13"
              placeholder="Contoh: 081234567890"
              required
            />
            <small> Masukkan 10-13 digit angka. </small>
          </div>
          <!-- Posisi -->
          <div class="form-group">
            <label for="posisi">Jenis Kelamin</label>
            <select id="posisi" name="posisi" required>
              <option value="">-- Pilih Jenis Kelamin --</option>
              <option value="cowo">Laki-Laki</option>
              <option value="cewe">Perempuan</option>
              </select>
          </div>
          <!-- Radio -->
          <fieldset>
            <legend>Pilih Paket</legend>
            <div class="option">
              <input
                type="radio"
                id="onsite"
                name="sistem_kerja"
                value="onsite"
                required
              />
              <label for="onsite"> Standar </label>
            </div>
            <div class="option">
              <input
                type="radio"
                id="hybrid"
                name="sistem_kerja"
                value="hybrid"
              />
              <label for="hybrid"> VIP </label>
            </div>
            <div class="option">
              <input
                type="radio"
                id="remote"
                name="sistem_kerja"
                value="remote"
              />
              <label for="remote"> VVIP </label>
            </div>
            
          </fieldset>
          <!-- Kemampuan -->
          <fieldset>
            <legend>Pilih Role</legend>
            <p class="instruction">Bisa lebih dari 1.</p>
            <div class="option">
              <input type="checkbox" id="html" name="keahlian[]" value="html" />
              <label for="html"> Jungler </label>
            </div>
            <div class="option">
              <input type="checkbox" id="css" name="keahlian[]" value="css" />
              <label for="css"> Goldaner </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="javascript"
                name="keahlian[]"
                value="javascript"
              />
              <label for="javascript"> Explaner </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="figma"
                name="keahlian[]"
                value="figma"
              />
              <label for="figma"> Roamer </label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="figma"
                name="keahlian[]"
                value="figma"
              />
              <label for="figma"> Midlaner </label>
            </div>
          </fieldset>
          <!-- Textarea -->
          <div class="form-group">
            <label for="motivasi"> Alasan Mengikuti Kursus Ini * </label>
            <textarea
              id="motivasi"
              name="motivasi"
              rows="6"
              minlength="10"
              maxlength="500"
              placeholder="Jelaskan alasan dan tujuan Anda mengikuti kursus ini..."
              required
            ></textarea>
            <small> Tuliskan antara 10-500 karakter. </small>
          </div>
          <!-- Upload Portofolio -->
          <div class="form-group">
            <label for="portofolio"> Bukti Pembayaran </label>
            <input
              type="file"
              id="portofolio"
              name="portofolio"
              accept=".pdf,.jpg,.jpeg,.png"
            />
            <small> Dapat berupa PDF (Max 2MB). </small>
          </div>
          <!-- Persetujuan -->
          <div class="agreement">
            <input
              type="checkbox"
              id="persetujuan"
              name="persetujuan"
              value="setuju"
              required
            />
            <label for="persetujuan">
              Saya menyetujui penggunaan data ini untuk proses kursus mobile legend. *
            </label>
          </div>
          <!-- Tombol -->
          <div class="button-group">
            <button type="submit" class="btn btn-primary">Kirim Lamaran</button>
            <button type="reset" class="btn btn-secondary">
              Bersihkan Form
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
